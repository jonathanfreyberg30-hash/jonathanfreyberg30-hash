<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="mystyle.css">
    <title>Explore | Jonathan's Portfolio</title>

<body id="infoback">
    <main>
        <nav id="board" aria-label="Portfolio navigation">

            <a href="#experience" class="polaroid polaroid-4">
                <div class="photo-frame"><img src = "myxp.JPG" alt="Experience Photo"></div></div>

            </a>
            <a href="https://www.facebook.com/jonathan.freyberg.834865" target="_blank" rel="noopener noreferrer" class="polaroid polaroid-5">
